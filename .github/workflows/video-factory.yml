name: ShockRadar Video Factory v10 (4-Template Remotion + Gate 2 + Chromium Deps)
on:
  workflow_dispatch:
    inputs:
      job_id: { required: true, type: string }
      targets: { required: true, type: string }
      payload_b64: { required: true, type: string }
      ig_creds_b64: { required: false, type: string, default: '' }
      yt_creds_b64: { required: false, type: string, default: '' }
permissions:
  contents: write
jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: engine/package.json
      - name: Install FFmpeg, Chromium Deps, Python & Remotion
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2
          sudo apt-get install -y -qq libasound2t64 || sudo apt-get install -y -qq libasound2 || true
          pip install -q edge-tts pillow requests google-auth google-api-python-client
          npm --prefix engine install --no-audit --no-fund
          npx --prefix engine remotion browser ensure
      - name: Prepare Dual-Voice TTS, Word Clock, Gate 2 Vision QC & SFX
        env:
          JOB_ID: ${{ inputs.job_id }}
          PAYLOAD_B64: ${{ inputs.payload_b64 }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python3 engine/scripts/prepare_assets.py
      - name: Render Remotion Video & Mix Audio
        run: node engine/scripts/render_and_mix.mjs
      - name: Cache Downloaded SFX & Music to Repo
        if: success()
        continue-on-error: true
        run: |
          git config user.name 'ShockRadar Factory Bot'
          git config user.email 'bot@shockradar.ai'
          git add assets/sfx assets/music 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'chore: cache auto-downloaded SFX & music'
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi
      - name: Upload Release Assets (MP4 + Thumb + SRT), Publish & Callback
        if: always()
        env:
          JOB_ID: ${{ inputs.job_id }}
          TARGETS: ${{ inputs.targets }}
          PAYLOAD_B64: ${{ inputs.payload_b64 }}
          IG_CREDS_B64: ${{ inputs.ig_creds_b64 }}
          YT_CREDS_B64: ${{ inputs.yt_creds_b64 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CB_SECRET: ${{ secrets.GH_CALLBACK_SECRET }}
        run: |
          python3 - << 'PYEOF'
          import os, json, base64, time, requests
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          payload = json.loads(base64.b64decode(os.environ['PAYLOAD_B64']).decode('utf-8'))
          bp = payload.get('blueprint') or {}
          plats = bp.get('platforms') or {}
          yt_meta = plats.get('youtube') or {}
          ig_meta = plats.get('instagram') or {}
          mode = payload.get('mode', 'story')
          is_long = (mode == 'long')
          targets = [t.strip().lower() for t in os.environ['TARGETS'].split(',') if t.strip()]
          callback_url = payload.get('callback_url', '')
          cb_token = payload.get('cb_token', '')
          yt_url, ig_url, video_url, asset_api_url, thumb_api_url, srt_api_url, err = '', '', '', '', '', '', ''
          rmeta = json.load(open('render_meta.json')) if os.path.exists('render_meta.json') else {}
          watch_next = payload.get('watch_next', '')
          full_yt_desc = str(yt_meta.get('description') or ig_meta.get('caption') or '')
          if watch_next:
              full_yt_desc += '\n\nWATCH NEXT:\n' + watch_next

          if not os.path.exists('output.mp4'):
              err = 'Remotion v10 render failed (or VISUAL_GEN_FAILED)! Check GitHub Actions step logs.'
          else:
              try:
                  h = {'Authorization': f"Bearer {os.environ['GH_TOKEN']}", 'Accept': 'application/vnd.github+json'}
                  rel = requests.post(f"https://api.github.com/repos/{os.environ['GH_REPO']}/releases", headers=h, json={'tag_name': os.environ['JOB_ID'], 'name': os.environ['JOB_ID']}).json()
                  base_up = rel['upload_url'].split('{')[0]
                  with open('output.mp4', 'rb') as f:
                      asset = requests.post(base_up + '?name=output.mp4', headers={**h, 'Content-Type': 'video/mp4'}, data=f.read()).json()
                  video_url = asset.get('browser_download_url', '')
                  asset_api_url = asset.get('url', '')
                  if os.path.exists('thumbnail.jpg'):
                      with open('thumbnail.jpg', 'rb') as tf:
                          ta = requests.post(base_up + '?name=thumbnail.jpg', headers={**h, 'Content-Type': 'image/jpeg'}, data=tf.read()).json()
                      thumb_api_url = ta.get('url', '')
                  if os.path.exists('captions.srt'):
                      with open('captions.srt', 'rb') as sf:
                          sa = requests.post(base_up + '?name=captions.srt', headers={**h, 'Content-Type': 'application/x-subrip'}, data=sf.read()).json()
                      srt_api_url = sa.get('url', '')
              except Exception as e:
                  err += f'REL: {e} | '
              if 'yt' in targets and os.environ.get('YT_CREDS_B64'):
                  try:
                      c = json.loads(base64.b64decode(os.environ['YT_CREDS_B64']).decode())
                      creds = Credentials(None, refresh_token=c['refreshToken'], token_uri='https://oauth2.googleapis.com/token', client_id=c['clientId'], client_secret=c['clientSecret'])
                      yt = build('youtube', 'v3', credentials=creds)
                      resp = yt.videos().insert(
                          part='snippet,status',
                          body={
                              'snippet': {
                                  'title': str(yt_meta.get('title') or 'ShockRadar Quant #shorts')[:98],
                                  'description': full_yt_desc[:4900],
                                  'tags': [str(t)[:30] for t in (yt_meta.get('tags') or ['crypto','trading','shorts'])[:15]],
                                  'categoryId': '27' if mode in ('edu', 'long') else '22',
                                  'defaultLanguage': 'en',
                                  'defaultAudioLanguage': 'en',
                              },
                              'status': {'privacyStatus': 'public', 'selfDeclaredMadeForKids': False, 'embeddable': True},
                          },
                          media_body=MediaFileUpload('output.mp4', mimetype='video/mp4', resumable=True),
                      ).execute()
                      vid_id = resp['id']
                      yt_url = f'https://youtu.be/{vid_id}' if is_long else f'https://youtube.com/shorts/{vid_id}'
                      if is_long and os.path.exists('thumbnail.jpg'):
                          try: yt.thumbnails().set(videoId=vid_id, media_body=MediaFileUpload('thumbnail.jpg', mimetype='image/jpeg')).execute()
                          except Exception: pass
                      if os.path.exists('captions.srt'):
                          try: yt.captions().insert(part='snippet', body={'snippet': {'videoId': vid_id, 'language': 'en', 'name': 'English', 'isDraft': False}}, media_body=MediaFileUpload('captions.srt', mimetype='application/octet-stream')).execute()
                          except Exception: pass
                      if yt_meta.get('pinned_comment'):
                          try: yt.commentThreads().insert(part='snippet', body={'snippet': {'videoId': vid_id, 'topLevelComment': {'snippet': {'textOriginal': yt_meta['pinned_comment']}}}}).execute()
                          except Exception: pass
                  except Exception as e:
                      err += f'YT: {e} | '
              if 'ig' in targets and not is_long and os.environ.get('IG_CREDS_B64') and video_url:
                  try:
                      c = json.loads(base64.b64decode(os.environ['IG_CREDS_B64']).decode())
                      cr = requests.post(f"https://graph.facebook.com/v21.0/{c['igUserId']}/media", json={'media_type': 'REELS', 'video_url': video_url, 'caption': ig_meta.get('caption', ''), 'access_token': c['accessToken']}).json()
                      cid = cr['id']
                      for _ in range(24):
                          time.sleep(5)
                          st = requests.get(f"https://graph.facebook.com/v21.0/{cid}?fields=status_code&access_token={c['accessToken']}").json().get('status_code')
                          if st == 'FINISHED': break
                          if st == 'ERROR': raise RuntimeError('Meta video processing error')
                      pub = requests.post(f"https://graph.facebook.com/v21.0/{c['igUserId']}/media_publish", json={'creation_id': cid, 'access_token': c['accessToken']}).json()
                      ig_url = f"https://instagram.com/reel/{pub.get('id', '')}"
                  except Exception as e:
                      err += f'IG: {e}'
          ok = bool(yt_url or ig_url or ('preview' in targets and (video_url or asset_api_url)))
          cb_body = {
              'job_id': os.environ['JOB_ID'],
              'mode': mode,
              'template': payload.get('template', 'UiMotionPromo'),
              'sources': rmeta.get('sources', {}),
              'sfx': rmeta.get('sfx', []),
              'gate2_score': rmeta.get('gate2_score', 0),
              'gate2_retries': rmeta.get('gate2_retries', 0),
              'cb_token': cb_token,
              'status': 'done' if ok else 'error',
              'yt_url': yt_url,
              'ig_url': ig_url,
              'video_url': video_url,
              'asset_api_url': asset_api_url,
              'thumb_api_url': thumb_api_url,
              'srt_api_url': srt_api_url,
              'error': err,
          }
          requests.post(callback_url, headers={'x-callback-secret': os.environ.get('CB_SECRET', ''), 'x-cb-token': cb_token}, json=cb_body, timeout=30)
          PYEOF