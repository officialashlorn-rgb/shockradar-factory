name: ShockRadar Video Factory v7 (Real 3D Flux/Gemini + Punchy Transitions + Viral Subtitles)
on:
  workflow_dispatch:
    inputs:
      job_id: { required: true, type: string }
      targets: { required: true, type: string }
      payload_b64: { required: true, type: string }
      ig_creds_b64: { required: false, type: string, default: '' }
      yt_creds_b64: { required: false, type: string, default: '' }
permissions:
  contents: write
jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg & Python Packages
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q edge-tts pillow requests google-auth google-api-python-client
      - name: Render Dynamic 9:16 Video (v7 Engine)
        env:
          JOB_ID: ${{ inputs.job_id }}
          PAYLOAD_B64: ${{ inputs.payload_b64 }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python3 - << 'PYEOF'
          import os, io, json, glob, math, base64, random, asyncio, urllib.parse, subprocess, textwrap, requests
          import edge_tts
          from PIL import Image, ImageDraw, ImageOps

          payload = json.loads(base64.b64decode(os.environ['PAYLOAD_B64']).decode('utf-8'))
          mode = payload.get('mode', 'pnl')
          hook = ' '.join(str(payload.get('hook_text', 'Market Shock Explained')).replace('\r', ' ').split())
          script = ' '.join(str(payload.get('voice_script', '')).replace('\r', ' ').split()) or hook
          voice = payload.get('voice_name') or 'en-US-AndrewNeural'
          card_url = payload.get('card_png_url', '')
          gen_scene_url = payload.get('gen_scene_url', '')
          cb_token = payload.get('cb_token', '')
          scenes = payload.get('scenes') or []
          pexels_key = (os.environ.get('PEXELS_API_KEY') or '').strip()

          # 1. Synthesize AI Voiceover + Exact Word Timestamps
          async def synth_voice_and_words(txt, vname):
              comm = edge_tts.Communicate(txt, vname, rate='+8%')
              words = []
              with open('voice.mp3', 'wb') as out_f:
                  async for chunk in comm.stream():
                      ctype = chunk.get('type')
                      if ctype == 'audio':
                          out_f.write(chunk['data'])
                      elif ctype == 'WordBoundary':
                          s = chunk['offset'] / 10_000_000.0
                          d = chunk['duration'] / 10_000_000.0
                          w = str(chunk.get('text', '')).strip()
                          if w:
                              words.append((s, s + max(d, 0.12), w))
              return words

          words = []
          has_voice = False
          voice_dur = 12.0 if mode == 'pnl' else 28.0
          try:
              words = asyncio.run(synth_voice_and_words(script, voice))
              if os.path.exists('voice.mp3') and os.path.getsize('voice.mp3') > 1500:
                  has_voice = True
                  p = subprocess.run(['ffprobe', '-v', 'error', '-show_entries', 'format=duration', '-of', 'default=noprint_wrappers=1:nokey=1', 'voice.mp3'], capture_output=True, text=True)
                  voice_dur = float(p.stdout.strip() or voice_dur)
          except Exception as e:
              print('TTS warning:', e)

          total_dur = max(11.0, min(48.0, voice_dur + 1.2))

          # 2. Build Clean ASS File (Hook Banner + Viral Word-Synced Subtitles + Bottom CTA — ZERO glyph boxes!)
          def fmt_ass_t(sec):
              sec = max(0.0, float(sec))
              h = int(sec // 3600)
              m = int((sec % 3600) // 60)
              s = int(sec % 60)
              cs = int(round((sec - int(sec)) * 100))
              if cs >= 100:
                  s += 1
                  cs = 0
              return f'{h}:{m:02d}:{s:02d}.{cs:02d}'

          def esc_ass(s):
              return ''.join(ch for ch in str(s) if ch.isprintable()).replace('\\', '').replace('{', '(').replace('}', ')').strip()

          if not words:
              raw_w = [w for w in script.split() if w]
              step = voice_dur / max(1, len(raw_w))
              words = [(i * step, (i + 1) * step, w) for i, w in enumerate(raw_w)]

          groups = []
          cur = []
          for item in words:
              cur.append(item)
              txt_len = sum(len(x[2]) for x in cur) + len(cur)
              if len(cur) >= 3 or txt_len >= 16 or item[2].endswith(('.', '!', '?', ',')):
                  groups.append((cur[0][0], cur[-1][1], ' '.join(x[2] for x in cur)))
                  cur = []
          if cur:
              groups.append((cur[0][0], cur[-1][1], ' '.join(x[2] for x in cur)))

          ass_header = '\n'.join([
              '[Script Info]',
              'ScriptType: v4.00+',
              'PlayResX: 1080',
              'PlayResY: 1920',
              'WrapStyle: 2',
              '',
              '[V4+ Styles]',
              'Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding',
              'Style: Hook,DejaVu Sans,58,&H00FFFFFF,&H00FFFFFF,&H00000000,&HB0000000,-1,0,0,0,100,100,1,0,3,16,0,8,70,70,115,1',
              'Style: Viral,DejaVu Sans,78,&H00FFFFFF,&H0000FFFF,&H00000000,&H90000000,-1,0,0,0,100,100,1,0,1,8,4,2,60,60,360,1',
              'Style: CTA,DejaVu Sans,34,&H0099D334,&H0099D334,&H00000000,&HC0180B06,-1,0,0,0,100,100,1,0,3,12,0,2,60,60,110,1',
              '',
              '[Events]',
              'Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text',
          ])
          ev_lines = []
          hook_wrapped = '\\N'.join(esc_ass(ln) for ln in textwrap.wrap(hook.upper(), width=21))
          hook_end = 3.6 if mode == 'story' else total_dur
          ev_lines.append(f'Dialogue: 1,0:00:00.00,{fmt_ass_t(hook_end)},Hook,,0,0,0,,{hook_wrapped}')
          ev_lines.append(f'Dialogue: 1,0:00:00.00,{fmt_ass_t(total_dur)},CTA,,0,0,0,,FREE 24H AI QUANT TRIAL  -  LINK IN BIO')
          for idx_g, (st, en, gtxt) in enumerate(groups):
              en_adj = groups[idx_g + 1][0] if idx_g + 1 < len(groups) else max(en + 0.3, voice_dur)
              en_adj = max(st + 0.16, min(en_adj, total_dur))
              clean_g = esc_ass(gtxt.upper())
              if not clean_g:
                  continue
              if idx_g % 3 == 1:
                  styled = '{\\c&H0038E1FF&}' + clean_g
              elif idx_g % 3 == 2:
                  styled = '{\\c&H0099D334&}' + clean_g
              else:
                  styled = clean_g
              ev_lines.append(f'Dialogue: 2,{fmt_ass_t(st)},{fmt_ass_t(en_adj)},Viral,,0,0,0,,{styled}')
          with open('subs.ass', 'w', encoding='utf-8') as f:
              f.write(ass_header + '\n' + '\n'.join(ev_lines) + '\n')

          # 3. Visual Pipeline: CF Workers AI Flux -> Gemini Image -> Pexels HD Video/Photo -> Pollinations
          def fit_vertical(img_bytes, out_path):
              im = Image.open(io.BytesIO(img_bytes)).convert('RGB')
              if im.width < 200 or im.height < 200:
                  raise ValueError('Image too small')
              fitted = ImageOps.fit(im, (1080, 1920), method=Image.Resampling.LANCZOS)
              overlay = Image.new('RGBA', (1080, 1920), (0, 0, 0, 0))
              dr = ImageDraw.Draw(overlay)
              for y in range(0, 340):
                  alpha = int(165 * (1 - y / 340))
                  dr.line([(0, y), (1080, y)], fill=(4, 6, 12, alpha))
              for y in range(1340, 1920):
                  alpha = int(215 * ((y - 1340) / 580))
                  dr.line([(0, y), (1080, y)], fill=(4, 6, 12, alpha))
              final = Image.alpha_composite(fitted.convert('RGBA'), overlay).convert('RGB')
              final.save(out_path, 'JPEG', quality=93)

          source_stats = {}
          def bump_src(k):
              source_stats[k] = source_stats.get(k, 0) + 1

          def build_scene_clip(scene, idx, clip_dur, out_clip):
              prompt = str(scene.get('prompt', '')).strip()
              kw = str(scene.get('keyword', 'wall street finance')).strip()
              # Option A: Worker AI 3D Image (Cloudflare Workers AI Flux-1-Schnell / Gemini Image)
              img_ready = False
              if gen_scene_url and prompt:
                  try:
                      r = requests.post(gen_scene_url, headers={'x-cb-token': cb_token}, json={'prompt': prompt, 'job_id': os.environ['JOB_ID']}, timeout=55)
                      ct = r.headers.get('content-type', '')
                      if r.ok and ct.startswith('image/') and len(r.content) > 12000:
                          fit_vertical(r.content, f'scene_{idx}.jpg')
                          bump_src(r.headers.get('x-img-source', 'AI-IMG'))
                          img_ready = True
                      else:
                          print(f'Scene {idx} worker-gen HTTP {r.status_code}: {r.text[:160]}')
                  except Exception as e:
                      print(f'Scene {idx} worker-gen err:', e)

              # Option B: Real HD Vertical Stock VIDEO from Pexels (if secret configured & AI image unavailable)
              if not img_ready and pexels_key:
                  try:
                      vr = requests.get('https://api.pexels.com/videos/search', params={'query': kw, 'orientation': 'portrait', 'per_page': 5}, headers={'Authorization': pexels_key}, timeout=15)
                      vids = vr.json().get('videos') or []
                      if vids:
                          vfiles = random.choice(vids).get('video_files') or []
                          vfiles = [vf for vf in vfiles if vf.get('file_type') == 'video/mp4' and vf.get('link')]
                          vfiles.sort(key=lambda x: abs((x.get('width') or 720) - 1080))
                          if vfiles:
                              mp = requests.get(vfiles[0]['link'], timeout=35)
                              if mp.ok and len(mp.content) > 40000:
                                  raw_v = f'stock_{idx}.mp4'
                                  with open(raw_v, 'wb') as f:
                                      f.write(mp.content)
                                  subprocess.run(['ffmpeg', '-y', '-stream_loop', '-1', '-i', raw_v, '-vf', 'scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,fps=25,format=yuv420p', '-t', f'{clip_dur:.2f}', '-an', '-c:v', 'libx264', '-preset', 'ultrafast', '-crf', '22', out_clip], check=True)
                                  bump_src('PEXELS-VID')
                                  return True
                  except Exception as e:
                      print(f'Scene {idx} Pexels vid err:', e)

              # Option C: Pollinations.ai fallback
              if not img_ready and prompt:
                  seed = random.randint(1000, 999999)
                  for mdl in ('flux', 'turbo'):
                      try:
                          u = f'https://image.pollinations.ai/prompt/{urllib.parse.quote(prompt)}?width=768&height=1344&model={mdl}&nologo=true&seed={seed}'
                          r = requests.get(u, timeout=30, headers={'User-Agent': 'Mozilla/5.0'})
                          if r.ok and r.headers.get('content-type', '').startswith('image/') and len(r.content) > 12000:
                              fit_vertical(r.content, f'scene_{idx}.jpg')
                              bump_src(f'POLL-{mdl.upper()}')
                              img_ready = True
                              break
                      except Exception as e:
                          print(f'Scene {idx} poll {mdl} err:', e)

              if not img_ready:
                  return False

              # Animate the 3D image with varied energetic camera motions (Zoom-In, Pan-Right, Zoom-Out, Pan-Left)
              frames = max(30, int(math.ceil(clip_dur * 25)))
              mtype = idx % 4
              if mtype == 0:
                  zp = f"zoompan=z='min(1.0+0.18*on/{frames},1.18)':d={frames}:x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':s=1080x1920:fps=25"
              elif mtype == 1:
                  zp = f"zoompan=z='1.16':d={frames}:x='(iw-iw/zoom)*on/{frames}':y='ih/2-(ih/zoom/2)':s=1080x1920:fps=25"
              elif mtype == 2:
                  zp = f"zoompan=z='max(1.18-0.18*on/{frames},1.0)':d={frames}:x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':s=1080x1920:fps=25"
              else:
                  zp = f"zoompan=z='1.16':d={frames}:x='(iw-iw/zoom)*(1-on/{frames})':y='ih/2-(ih/zoom/2)':s=1080x1920:fps=25"
              subprocess.run(['ffmpeg', '-y', '-loop', '1', '-i', f'scene_{idx}.jpg', '-vf', f'scale=1080:1920,{zp},format=yuv420p', '-t', f'{clip_dur:.2f}', '-c:v', 'libx264', '-preset', 'ultrafast', '-crf', '21', out_clip], check=True)
              return True

          # Download ShockRadar PnL Proof Card
          if card_url:
              cr = requests.get(card_url, timeout=30)
              if cr.ok and len(cr.content) > 5000:
                  with open('card.png', 'wb') as cf:
                      cf.write(cr.content)

          # Build Audio Bed (User music/*.mp3 OR synthesized dark cinematic bass bed) + Transition Whoosh SFX
          music_files = glob.glob('music/*.mp3') + glob.glob('music/**/*.mp3', recursive=True)
          music = random.choice(music_files) if music_files else ''
          if not music:
              subprocess.run(['ffmpeg', '-y', '-f', 'lavfi', '-i', f'aevalsrc=0.07*sin(2*PI*55*t)+0.04*sin(2*PI*82.4*t)*(0.5+0.5*sin(2*PI*0.35*t)):s=44100:d={total_dur:.2f}', '-af', 'lowpass=f=180', 'synth_bed.wav'], check=True)
              music = 'synth_bed.wav'

          def finalize_with_audio(raw_vid, cut_times):
              fade_out = max(1.0, total_dur - 1.4)
              cmd = ['ffmpeg', '-y', '-i', raw_vid]
              f_chains = []
              mix_inputs = []
              in_idx = 1
              if has_voice:
                  cmd += ['-i', 'voice.mp3']
                  f_chains.append(f'[{in_idx}:a]volume=1.22,apad[v_aud]')
                  mix_inputs.append('[v_aud]')
                  in_idx += 1
              cmd += ['-stream_loop', '-1', '-i', music]
              m_vol = 0.14 if has_voice else 0.45
              f_chains.append(f'[{in_idx}:a]volume={m_vol},afade=t=in:st=0:d=0.6,afade=t=out:st={fade_out:.2f}:d=1.4[m_aud]')
              mix_inputs.append('[m_aud]')
              in_idx += 1
              # Add subtle crisp whoosh SFX on every scene switch
              for c_i, ct in enumerate(cut_times[:8]):
                  cmd += ['-f', 'lavfi', '-t', '0.28', '-i', 'anoisesrc=c=pink:r=44100:a=0.18']
                  ms = max(0, int(ct * 1000))
                  f_chains.append(f'[{in_idx}:a]bandpass=f=900:w=600,afade=t=in:st=0:d=0.10,afade=t=out:st=0.12:d=0.16,adelay={ms}|{ms}[sfx{c_i}]')
                  mix_inputs.append(f'[sfx{c_i}]')
                  in_idx += 1
              f_chains.append(f"{''.join(mix_inputs)}amix=inputs={len(mix_inputs)}:duration=longest:normalize=0[aout]")
              cmd += ['-filter_complex', ';'.join(f_chains), '-map', '0:v', '-map', '[aout]', '-t', f'{total_dur:.2f}', '-c:v', 'libx264', '-crf', '23', '-preset', 'fast', '-pix_fmt', 'yuv420p', '-c:a', 'aac', '-b:a', '128k', '-movflags', '+faststart', 'output.mp4']
              subprocess.run(cmd, check=True)

          cut_times = []
          if mode == 'story' and len(scenes) >= 3:
              end_dur = 3.6
              story_dur = max(12.0, total_dur - end_dur)
              n_sc = min(6, len(scenes))
              xfade_d = 0.28
              sc_dur = (story_dur + xfade_d * n_sc) / n_sc
              clip_paths = []
              clip_durs = []
              for idx, sc in enumerate(scenes[:n_sc]):
                  cp = f'clip_{idx}.mp4'
                  ok_sc = build_scene_clip(sc, idx, sc_dur, cp)
                  if ok_sc:
                      clip_paths.append(cp)
                      clip_durs.append(sc_dur)
              if len(clip_paths) < 2:
                  raise RuntimeError('VISUAL_GEN_FAILED: No 3D scene images could be generated! Add the free Cloudflare Workers AI binding (Variable name: AI) to your tabb Worker or set PEXELS_API_KEY in GitHub Secrets.')
              # Re-stretch scene durations cleanly if any scene was skipped, then append ShockRadar PnL End-Card
              if os.path.exists('card.png'):
                  end_clip_dur = end_dur + xfade_d
                  end_frames = max(30, int(math.ceil(end_clip_dur * 25)))
                  subprocess.run(['ffmpeg', '-y', '-loop', '1', '-i', 'card.png', '-vf', f"scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2:color=#05070c,zoompan=z='min(1.0+0.08*on/{end_frames},1.08)':d={end_frames}:x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':s=1080x1920:fps=25,format=yuv420p", '-t', f'{end_clip_dur:.2f}', '-c:v', 'libx264', '-preset', 'ultrafast', '-crf', '21', 'clip_end.mp4'], check=True)
                  clip_paths.append('clip_end.mp4')
                  clip_durs.append(end_clip_dur)

              # Chain punchy dynamic xfade transitions (slideright, wipeleft, smoothup, circleopen, slideleft, fadeblack)
              transitions = ['slideright', 'wipeleft', 'smoothup', 'slideleft', 'circleopen', 'fadeblack']
              ff_in = []
              for cp in clip_paths:
                  ff_in += ['-i', cp]
              fparts = []
              prev_tag = '[0:v]'
              offset = clip_durs[0] - xfade_d
              for j in range(1, len(clip_paths)):
                  out_tag = f'[xf{j}]'
                  tr = transitions[(j - 1) % len(transitions)]
                  off_val = max(0.2, offset)
                  cut_times.append(off_val)
                  fparts.append(f'{prev_tag}[{j}:v]xfade=transition={tr}:duration={xfade_d:.2f}:offset={off_val:.2f}{out_tag}')
                  prev_tag = out_tag
                  offset += clip_durs[j] - xfade_d
              fparts.append(f'{prev_tag}ass=subs.ass[vout]')
              subprocess.run(['ffmpeg', '-y', *ff_in, '-filter_complex', ';'.join(fparts), '-map', '[vout]', '-c:v', 'libx264', '-preset', 'fast', '-crf', '22', '-pix_fmt', 'yuv420p', 'raw_video.mp4'], check=True)
              finalize_with_audio('raw_video.mp4', cut_times)
          else:
              frames = int(total_dur * 25) + 20
              vf = f"scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2:color=#05070c,zoompan=z='min(1.0+0.10*on/{frames},1.10)':d={frames}:x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':s=1080x1920:fps=25,ass=subs.ass"
              subprocess.run(['ffmpeg', '-y', '-loop', '1', '-i', 'card.png', '-vf', vf, '-t', f'{total_dur:.2f}', '-c:v', 'libx264', '-preset', 'fast', '-crf', '22', '-pix_fmt', 'yuv420p', 'raw_video.mp4'], check=True)
              bump_src('PNL-CARD')
              finalize_with_audio('raw_video.mp4', [])

          with open('render_meta.json', 'w', encoding='utf-8') as mf:
              json.dump({'sources': source_stats}, mf)
          print('Render complete! Sources:', source_stats)
          PYEOF
      - name: Publish & Callback
        if: always()
        env:
          JOB_ID: ${{ inputs.job_id }}
          TARGETS: ${{ inputs.targets }}
          PAYLOAD_B64: ${{ inputs.payload_b64 }}
          IG_CREDS_B64: ${{ inputs.ig_creds_b64 }}
          YT_CREDS_B64: ${{ inputs.yt_creds_b64 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CB_SECRET: ${{ secrets.GH_CALLBACK_SECRET }}
        run: |
          python3 - << 'PYEOF'
          import os, json, base64, time, requests
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          payload = json.loads(base64.b64decode(os.environ['PAYLOAD_B64']).decode('utf-8'))
          targets = [t.strip().lower() for t in os.environ['TARGETS'].split(',') if t.strip()]
          caption = payload.get('caption', '')
          yt_title = payload.get('yt_title', 'ShockRadar AI #shorts')
          callback_url = payload.get('callback_url', '')
          cb_token = payload.get('cb_token', '')
          yt_url, ig_url, video_url, asset_api_url, err = '', '', '', '', ''
          sources = {}
          if os.path.exists('render_meta.json'):
              try:
                  sources = json.load(open('render_meta.json')).get('sources', {})
              except Exception:
                  pass
          if not os.path.exists('output.mp4'):
              err = 'Video render failed! Check that Cloudflare Workers AI binding (AI) is added to your Worker (free 10k neurons/day) or PEXELS_API_KEY is set in GitHub Secrets.'
          else:
              def upload_release_mp4():
                  h = {'Authorization': f"Bearer {os.environ['GH_TOKEN']}", 'Accept': 'application/vnd.github+json'}
                  rel = requests.post(f"https://api.github.com/repos/{os.environ['GH_REPO']}/releases", headers=h, json={'tag_name': os.environ['JOB_ID'], 'name': os.environ['JOB_ID']}).json()
                  up = rel['upload_url'].split('{')[0] + '?name=output.mp4'
                  with open('output.mp4', 'rb') as f:
                      asset = requests.post(up, headers={**h, 'Content-Type': 'video/mp4'}, data=f.read()).json()
                  return asset.get('browser_download_url', ''), asset.get('url', '')
              if 'preview' in targets or ('ig' in targets and os.environ.get('IG_CREDS_B64')):
                  try:
                      video_url, asset_api_url = upload_release_mp4()
                  except Exception as e:
                      err += f'REL: {e} | '
              if 'yt' in targets and os.environ.get('YT_CREDS_B64'):
                  try:
                      c = json.loads(base64.b64decode(os.environ['YT_CREDS_B64']).decode())
                      creds = Credentials(None, refresh_token=c['refreshToken'], token_uri='https://oauth2.googleapis.com/token', client_id=c['clientId'], client_secret=c['clientSecret'])
                      yt = build('youtube', 'v3', credentials=creds)
                      resp = yt.videos().insert(part='snippet,status', body={'snippet': {'title': yt_title[:95], 'description': caption, 'categoryId': '22'}, 'status': {'privacyStatus': 'public', 'selfDeclaredMadeForKids': False}}, media_body=MediaFileUpload('output.mp4', mimetype='video/mp4', resumable=True)).execute()
                      yt_url = f"https://youtube.com/shorts/{resp['id']}"
                  except Exception as e:
                      err += f'YT: {e} | '
              if 'ig' in targets and os.environ.get('IG_CREDS_B64') and video_url:
                  try:
                      c = json.loads(base64.b64decode(os.environ['IG_CREDS_B64']).decode())
                      cr = requests.post(f"https://graph.facebook.com/v21.0/{c['igUserId']}/media", json={'media_type': 'REELS', 'video_url': video_url, 'caption': caption, 'access_token': c['accessToken']}).json()
                      cid = cr['id']
                      for _ in range(24):
                          time.sleep(5)
                          st = requests.get(f"https://graph.facebook.com/v21.0/{cid}?fields=status_code&access_token={c['accessToken']}").json().get('status_code')
                          if st == 'FINISHED': break
                          if st == 'ERROR': raise RuntimeError('Meta video processing error')
                      pub = requests.post(f"https://graph.facebook.com/v21.0/{c['igUserId']}/media_publish", json={'creation_id': cid, 'access_token': c['accessToken']}).json()
                      ig_url = f"https://instagram.com/reel/{pub.get('id', '')}"
                  except Exception as e:
                      err += f'IG: {e}'
          ok = bool(yt_url or ig_url or ('preview' in targets and (video_url or asset_api_url)))
          cb_headers = {'x-callback-secret': os.environ.get('CB_SECRET', ''), 'x-cb-token': cb_token}
          cb_body = {'job_id': os.environ['JOB_ID'], 'mode': payload.get('mode', 'pnl'), 'style_name': payload.get('style_name', ''), 'sources': sources, 'cb_token': cb_token, 'status': 'done' if ok else 'error', 'yt_url': yt_url, 'ig_url': ig_url, 'video_url': video_url, 'asset_api_url': asset_api_url, 'error': err}
          res = requests.post(callback_url, headers=cb_headers, json=cb_body, timeout=30)
          print('Callback HTTP:', res.status_code, res.text[:200])
          PYEOF